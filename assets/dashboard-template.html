<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="查看、选择并继续迭代设计原型。">
  <title>Lottery Ticket Design</title>
  <style>
    :root {
      --bg: #f0f2ef; --surface: #ffffff; --surface-warm: #f4f6f3; --surface-raised: #fafbf9;
      --fg: #292f2b; --fg-2: #606b64; --muted: #69746c; --border: #e0e6df; --border-soft: #edf0eb;
      --accent: #4c6355; --accent-soft: #eaf2ec; --ink: #ffffff;
      --label-bg: #edf3f7; --label-fg: #526b7c; --label-border: #dde7ed;
      --success-bg: #eaf3ec; --success-fg: #466750; --skeleton: #e6ebe5;
      --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --radius: 22px; --sidebar-width: 84px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; color-scheme: light; }
    body { margin: 0; min-width: 320px; min-height: 100vh; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
    button, select, textarea { font: inherit; }
    button, a, select, input { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    a { color: inherit; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    [hidden] { display: none !important; }
    .skip-link { position: fixed; z-index: 80; top: 12px; left: 12px; padding: 9px 14px; color: #fff; background: var(--accent); border-radius: 12px; transform: translateY(-160%); }
    .skip-link:focus { transform: translateY(0); }
    .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 20; display: flex; width: var(--sidebar-width); flex-direction: column; align-items: center; padding: 24px 8px 20px; border: 0; background: transparent; box-shadow: none; }
    .brand { display: flex; width: 100%; justify-content: center; padding: 0 0 28px; text-decoration: none; }
    .brand-mark { display: grid; width: 38px; height: 38px; place-items: center; color: var(--fg); font: 750 24px/1 var(--font-body); letter-spacing: -.06em; }
    .sidebar nav { display: flex; width: 100%; flex-direction: column; align-items: center; gap: 8px; }
    .nav-link { display: flex; width: 62px; min-height: 62px; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 7px 4px; border-radius: 17px; color: #657067; font-size: 10px; font-weight: 500; line-height: 1.1; text-align: center; text-decoration: none; transition: color .18s ease, background-color .18s ease; }
    .nav-link:hover { color: var(--fg-2); background: #e8ede7; }
    .nav-link[aria-current="location"] { color: var(--label-fg); background: #e5edf2; }
    .nav-icon { flex: none; width: 20px; height: 20px; color: currentColor; }
    .nav-text { white-space: nowrap; }
    #prototype-grid, #selection-tools { scroll-margin-top: 88px; }
    .main { min-height: 100vh; margin-left: var(--sidebar-width); padding: 22px 24px 28px; }
    .content { width: min(100%, 1590px); min-height: calc(100vh - 50px); margin: auto; padding: 48px clamp(24px, 4vw, 64px) 82px; border: 1px solid var(--border); border-radius: 32px; background: var(--surface); box-shadow: 0 20px 60px #293b2e0d, 0 3px 12px #293b2e05; }
    .eyebrow { color: var(--muted); font: 500 11px/1.5 var(--font-body); letter-spacing: .06em; text-transform: uppercase; }
    .hero { margin-bottom: 24px; }
    h1 { margin: 12px 0 0; font: 700 clamp(28px, 3.4vw, 42px)/1.2 var(--font-body); letter-spacing: -.035em; }
    .brief-panel { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 14px; margin: 0 0 32px; padding: 0; }
    .brief-panel > span { color: var(--muted); font: 500 12px/1.5 var(--font-body); }
    .brief-panel p { margin: 0; color: var(--fg-2); overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    .toolbar-sentinel { height: 1px; margin-bottom: -1px; pointer-events: none; }
    .toolbar { position: sticky; top: 18px; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 -12px 20px; padding: 10px 12px; border: 1px solid transparent; border-radius: 20px; background: #ffffffed; backdrop-filter: blur(18px); transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease; }
    .toolbar.is-stuck { border-color: #dfe6df; background: #f4f7f3f5; box-shadow: 0 10px 28px #293b2e12, 0 2px 6px #293b2e05; }
    .toolbar-title { margin: 0 auto 0 5px; font-size: 14px; font-weight: 650; }
    .toolbar-count { padding: 4px 9px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--surface-warm); color: var(--fg-2); font-size: 11px; font-variant-numeric: tabular-nums; }
    .toolbar-count[href] { border-color: #d8e6da; background: var(--success-bg); color: var(--success-fg); text-decoration: none; }
    .toolbar-count[href]:hover { border-color: #b9cdbc; }
    .button { min-height: 38px; padding: 0 14px; border: 1px solid var(--border); border-radius: 13px; background: var(--surface); color: var(--fg); font-size: 12px; font-weight: 600; transition: background-color .18s ease, border-color .18s ease; }
    .button:hover { border-color: #c5d0c6; background: var(--surface-warm); }
    .button.primary { border-color: var(--accent); background: var(--accent); color: var(--ink); }
    .button.primary:hover { border-color: #3f5547; background: #3f5547; }
    .button:disabled { opacity: .45; cursor: not-allowed; }
    .timeline { position: relative; display: grid; gap: 34px; padding: 4px 0 0 30px; }
    .timeline::before { position: absolute; top: 12px; bottom: 28px; left: 9px; width: 1px; background: #e2e8e1; content: ""; }
    .timeline:empty::before { display: none; }
    .timeline-entry { position: relative; min-width: 0; }
    .timeline-marker { position: absolute; top: 8px; left: -26px; z-index: 1; width: 11px; height: 11px; border: 2px solid #fff; border-radius: 50%; background: #b6c1b7; box-shadow: 0 0 0 1px #c5cec5; }
    .timeline-entry.is-latest .timeline-marker { background: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .round-meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px 10px; min-height: 23px; margin: 0 0 13px; padding-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .round-meta h2 { margin: 0; color: var(--fg-2); font: 600 11px/1.5 var(--font-body); }
    .round-meta p { margin: 0; }
    .round-latest { padding: 2px 7px; border-radius: 7px; background: var(--success-bg); color: var(--success-fg); font-size: 10px; font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; gap: 18px; }
    .card { position: relative; min-width: 0; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: 0 2px 8px #293b2e04; transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease; }
    .card:hover { border-color: #c4d0c5; box-shadow: 0 8px 22px #293b2e0b; transform: translateY(-2px); }
    .card.is-selected { border-color: #8ca693; box-shadow: 0 0 0 1px #8ca693 inset, 0 4px 16px #4667500b; }
    .card-preview { position: relative; height: clamp(200px, 19vw, 270px); overflow: hidden; border-bottom: 1px solid var(--border-soft); background: var(--surface-warm); }
    .card-preview img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
    .card-preview iframe { width: 100%; height: 100%; border: 0; background: white; pointer-events: none; }
    .skeleton-preview { display: grid; place-items: center; padding: 22px 24px; background: var(--surface-warm); }
    .skeleton-screen { width: min(100%, 350px); height: 100%; max-height: 226px; overflow: hidden; border: 1px solid var(--border); border-radius: 15px; background: #fcfdfb; box-shadow: 0 5px 16px #293b2e06; }
    .skeleton-screen-top { display: flex; height: 29px; align-items: center; gap: 5px; padding: 0 11px; border-bottom: 1px solid var(--border-soft); }
    .skeleton-dot { width: 5px; height: 5px; border-radius: 50%; background: #d6ded4; }
    .skeleton-screen-body { display: grid; grid-template-columns: 23% minmax(0, 1fr); height: calc(100% - 29px); }
    .skeleton-rail { display: grid; align-content: start; gap: 10px; padding: 16px 11px; border-right: 1px solid var(--border-soft); }
    .skeleton-page { display: grid; align-content: start; gap: 12px; padding: 17px; }
    .skeleton-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .skeleton-tile { height: 58px; border-radius: 10px; background: #e9eee7; }
    .skeleton-line { display: block; width: 100%; height: 9px; border-radius: 6px; background: var(--skeleton); }
    .skeleton-line.is-short { width: 44%; }
    .skeleton-line.is-medium { width: 68%; }
    .skeleton-line.is-long { width: 88%; }
    .skeleton-line.is-title { width: 61%; height: 22px; border-radius: 8px; }
    .skeleton-line.is-label { width: 30%; height: 8px; }
    .skeleton-line.is-hero-title { width: clamp(180px, 30vw, 300px); max-width: 100%; height: clamp(34px, 3.4vw, 44px); border-radius: 12px; }
    .skeleton-line.is-brief-label { width: 36px; height: 11px; }
    .brief-panel p.skeleton-brief { display: grid; gap: 9px; overflow: visible; -webkit-line-clamp: unset; }
    .skeleton-brief .skeleton-line { height: 12px; }
    .skeleton-body { display: grid; gap: 10px; margin: 0 0 14px; }
    .skeleton-body .skeleton-line.is-title { margin: 3px 0 1px; }
    .skeleton-meta-value { display: flex; align-items: center; min-height: 16px; }
    .skeleton-meta-value .skeleton-line { height: 8px; }
    .card-open { position: absolute; z-index: 1; inset: 0; display: block; font-size: 0; }
    .card-open:focus-visible { outline-offset: -5px; }
    .pick { position: absolute; z-index: 3; top: 12px; left: 12px; display: inline-flex; min-height: 34px; align-items: center; gap: 7px; padding: 0 10px; border: 1px solid var(--border); border-radius: 11px; background: #fffffff0; color: var(--fg-2); cursor: pointer; font-size: 11px; font-weight: 500; backdrop-filter: blur(8px); transition: background-color .18s ease, border-color .18s ease; }
    .pick input { appearance: none; display: grid; width: 16px; height: 16px; margin: 0; place-content: center; border: 1.5px solid #a8b5aa; border-radius: 5px; background: #fff; color: #fff; cursor: pointer; }
    .pick input::after { width: 8px; height: 4px; margin-top: -2px; border-bottom: 1.5px solid currentColor; border-left: 1.5px solid currentColor; transform: rotate(-45deg) scale(0); content: ""; }
    .pick input:checked { border-color: var(--accent); background: var(--accent); }
    .pick input:checked::after { transform: rotate(-45deg) scale(1); }
    .card.is-selected .pick { border-color: #cbdccf; background: var(--success-bg); color: var(--success-fg); }
    .number { position: absolute; z-index: 3; top: 12px; right: 12px; padding: 7px 9px; border: 1px solid var(--label-border); border-radius: 10px; background: var(--label-bg); color: var(--label-fg); font: 600 11px/1.2 var(--font-body); font-variant-numeric: tabular-nums; pointer-events: none; }
    .card-body { padding: 18px 20px 20px; }
    .card-kicker { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--muted); font: 400 11px/1.4 var(--font-body); }
    .card-kicker > span:first-child { padding: 3px 8px; border: 1px solid var(--label-border); border-radius: 8px; background: var(--label-bg); color: var(--label-fg); font-weight: 500; }
    .card h3 { margin: 10px 0 8px; font: 650 clamp(18px, 1.5vw, 21px)/1.35 var(--font-body); letter-spacing: -.02em; }
    .summary { margin: 0 0 13px; color: var(--fg-2); font-size: 13px; line-height: 1.6; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    .meta { display: grid; gap: 8px; margin: 0; padding: 9px 0 0; }
    .meta div { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 6px; }
    .meta dt { color: var(--muted); font-size: 11px; }
    .meta dd { margin: 0; color: var(--fg-2); font-size: 12px; overflow-wrap: anywhere; }
    .card details { position: relative; z-index: 2; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border-soft); }
    .card summary { display: flex; align-items: center; justify-content: space-between; color: var(--fg-2); cursor: pointer; font-size: 11px; list-style: none; }
    .card summary::-webkit-details-marker { display: none; }
    .card summary::after { width: 6px; height: 6px; margin-right: 2px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); content: ""; }
    .card details[open] summary::after { transform: rotate(225deg); }
    .more { display: grid; gap: 9px; margin: 10px 0 0; color: var(--fg-2); font-size: 11px; }
    .more div { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 6px; }
    .more dt { color: var(--muted); }
    .more dd { margin: 0; overflow-wrap: anywhere; }
    .more a { color: var(--fg); text-decoration: underline; text-underline-offset: 2px; }
    .handoff { display: grid; grid-template-columns: minmax(0, .5fr) minmax(280px, 1.5fr); gap: 24px; margin: 0 0 32px; padding: 24px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-raised); scroll-margin-top: 24px; }
    .handoff h2 { margin: 0 0 8px; font: 650 20px/1.3 var(--font-body); letter-spacing: -.02em; }
    .handoff p { margin: 0; color: var(--fg-2); font-size: 12px; }
    .handoff-field label { display: block; margin-bottom: 7px; color: var(--muted); font-size: 11px; }
    .handoff-field textarea { display: block; width: 100%; min-height: 86px; resize: vertical; padding: 12px; border: 1px solid var(--border); border-radius: 15px; background: var(--surface); color: var(--fg); font: 12px/1.65 var(--font-body); }
    .handoff-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .feedback { min-height: 21px; margin-top: 10px !important; color: var(--fg-2) !important; font-size: 11px !important; }
    .feedback.is-success { padding: 7px 10px; border-radius: 10px; background: var(--success-bg); color: var(--success-fg) !important; }
    .empty { padding: 55px 20px; border: 1px dashed var(--border); border-radius: var(--radius); color: var(--muted); text-align: center; }
    @media (max-width: 1250px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 800px) {
      :root { --sidebar-width: 72px; }
      .sidebar { padding: 20px 6px; }
      .nav-link { width: 58px; }
      .main { padding: 16px; }
      .content { min-height: calc(100vh - 32px); padding-top: 34px; border-radius: 24px; }
    }
    @media (max-width: 650px) {
      :root { --sidebar-width: 64px; }
      .sidebar { padding: 17px 4px; }
      .brand { padding-bottom: 24px; }
      .brand-mark { width: 34px; height: 34px; font-size: 22px; }
      .nav-link { width: 54px; min-height: 58px; font-size: 9px; }
      .nav-icon { width: 18px; height: 18px; }
      .main { padding: 10px 10px 16px; }
      .content { min-height: calc(100vh - 26px); padding: 26px 16px 70px; border-radius: 20px; }
      .brief-panel { grid-template-columns: 1fr; gap: 5px; }
      .toolbar { top: 8px; }
      .toolbar-title { width: 100%; }
      .timeline { gap: 28px; padding-left: 26px; }
      .timeline::before { left: 8px; }
      .timeline-marker { left: -23px; }
      .grid, .handoff { grid-template-columns: 1fr; }
      .card-preview { height: 230px; }
      .handoff { padding: 18px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#workspace">跳到内容</a>
  <aside class="sidebar" aria-label="工作区导航">
    <a class="brand" href="#workspace" aria-label="返回首页"><span class="brand-mark" aria-hidden="true">L</span></a>
    <nav aria-label="页面导航">
      <a class="nav-link" href="#workspace" aria-current="location"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 10 8.5-7 8.5 7v10a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z"/><path d="M9 21v-7h6v7"/></svg><span class="nav-text">首页</span></a>
      <a class="nav-link" href="#prototype-grid"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg><span class="nav-text">原型</span></a>
      <a class="nav-link" href="#selection-tools"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m7.5 12 3 3 6-6"/></svg><span class="nav-text">选择</span></a>
    </nav>
  </aside>

  <main class="main" id="workspace">
    <div class="content">
      <section class="handoff" id="handoff" aria-labelledby="handoff-title" hidden>
        <div><h2 id="handoff-title">继续迭代</h2><p>勾选后自动复制编号。</p></div>
        <div class="handoff-field"><label for="handoff-text">给 agent 的指令</label><textarea id="handoff-text" readonly aria-describedby="copy-feedback"></textarea><div class="handoff-actions"><button class="button" id="copy-prompt-button" type="button">复制完整指令</button><button class="button" id="select-text-button" type="button" hidden>选中文字</button></div><p class="feedback" id="copy-feedback" role="status" aria-live="polite"></p></div>
      </section>
      <header class="hero">
        <div class="eyebrow" id="hero-eyebrow">PROTOTYPES</div>
        <h1 id="project-title">原型总览</h1>
      </header>
      <section class="brief-panel" aria-label="设计需求"><span>需求</span><p id="project-brief"></p></section>
      <div class="toolbar-sentinel" id="toolbar-sentinel" aria-hidden="true"></div>
      <div class="toolbar" id="selection-tools" aria-label="原型操作">
        <strong class="toolbar-title" id="timeline-title">设计时间线</strong>
        <a class="toolbar-count" id="selection-count">已选 0 份</a>
        <button class="button" id="clear-button" type="button">清空选择</button>
        <button class="button primary" id="copy-button" type="button">复制编号</button>
      </div>
      <div class="timeline" id="prototype-grid" aria-label="原型时间线"></div>
      <p class="empty" id="empty" hidden>还没有原型。</p>

    </div>
  </main>

  <script type="application/json" id="prototype-data">__BOARD_DATA_JSON__</script>
  <script>
    (() => {
      'use strict';
      const data = JSON.parse(document.getElementById('prototype-data').textContent);
      const selected = new Set();
      const timeline = document.getElementById('prototype-grid');
      const output = document.getElementById('handoff-text');
      const feedback = document.getElementById('copy-feedback');
      const navLinks = [...document.querySelectorAll('.nav-link')];
      const toolbar = document.getElementById('selection-tools');
      const toolbarSentinel = document.getElementById('toolbar-sentinel');
      const skeletonDemo = data.project.dashboardSkeleton === true;
      let copyQueue = Promise.resolve();

      function syncToolbar() {
        const stickyTop = parseFloat(getComputedStyle(toolbar).top) || 0;
        toolbar.classList.toggle('is-stuck', toolbarSentinel.getBoundingClientRect().top <= stickyTop);
      }
      window.addEventListener('scroll', syncToolbar, { passive: true });
      window.addEventListener('resize', syncToolbar);
      syncToolbar();

      function syncNav() {
        const target = navLinks.some(link => link.getAttribute('href') === window.location.hash) ? window.location.hash : '#workspace';
        navLinks.forEach(link => {
          if (link.getAttribute('href') === target) link.setAttribute('aria-current', 'location');
          else link.removeAttribute('aria-current');
        });
      }
      window.addEventListener('hashchange', syncNav);
      syncNav();

      document.title = skeletonDemo ? 'Lottery Ticket Design · 骨架演示' : data.project.title + ' · Lottery Ticket Design';
      const projectTitle = document.getElementById('project-title');
      const projectBrief = document.getElementById('project-brief');
      if (skeletonDemo) {
        projectTitle.replaceChildren(skeletonLine('is-hero-title'), element('span', 'sr-only', '项目名称待生成'));
        const briefLabel = document.querySelector('.brief-panel > span');
        briefLabel.replaceChildren(skeletonLine('is-brief-label'));
        projectBrief.classList.add('skeleton-brief');
        projectBrief.replaceChildren(skeletonLine('is-long'), skeletonLine('is-medium'), element('span', 'sr-only', '设计需求待生成'));
      } else {
        projectTitle.textContent = data.project.title;
        projectBrief.textContent = data.project.brief || '等待输入设计需求。';
      }
      const latest = data.batches.at(-1);
      document.getElementById('hero-eyebrow').textContent = `DESIGN HISTORY / ${data.batches.length} ROUNDS`;
      document.getElementById('timeline-title').textContent = `设计时间线 · ${data.batches.length} 轮`;

      function element(tag, className, value) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (value !== undefined) node.textContent = value;
        return node;
      }
      function metaRow(dl, label, value) {
        const row = element('div');
        row.append(element('dt', '', label), element('dd', '', value || '—'));
        dl.append(row);
      }
      function skeletonLine(variant = '') {
        const line = element('span', `skeleton-line${variant ? ` ${variant}` : ''}`);
        line.setAttribute('aria-hidden', 'true');
        return line;
      }
      function skeletonMetaRow(dl, label, variant) {
        const row = element('div');
        const value = element('dd', 'skeleton-meta-value');
        value.append(skeletonLine(variant));
        row.append(element('dt', '', label), value);
        dl.append(row);
      }
      function skeletonScreen() {
        const screen = element('div', 'skeleton-screen');
        screen.setAttribute('aria-hidden', 'true');
        const top = element('div', 'skeleton-screen-top');
        top.append(...Array.from({ length: 3 }, () => element('span', 'skeleton-dot')));
        const inner = element('div', 'skeleton-screen-body');
        const rail = element('div', 'skeleton-rail');
        rail.append(skeletonLine('is-medium'), skeletonLine(), skeletonLine('is-long'), skeletonLine('is-medium'));
        const page = element('div', 'skeleton-page');
        const tiles = element('div', 'skeleton-tiles');
        tiles.append(element('div', 'skeleton-tile'), element('div', 'skeleton-tile'));
        page.append(skeletonLine('is-medium'), skeletonLine('is-long'), tiles, skeletonLine(), skeletonLine('is-medium'));
        inner.append(rail, page); screen.append(top, inner);
        return screen;
      }
      function inspirationRows(dl, references) {
        (references || []).forEach((reference, index) => {
          const row = element('div');
          const description = element('dd');
          const name = element(reference.url ? 'a' : 'span', '', reference.name);
          if (reference.url) { name.href = reference.url; name.target = '_blank'; name.rel = 'noopener noreferrer'; }
          description.append(name, document.createTextNode(` · ${reference.aspect} → ${reference.adaptation}`));
          row.append(element('dt', '', index === 0 ? '参考' : ''), description);
          dl.append(row);
        });
      }
      function fileRow(dl, label, path) {
        const row = element('div');
        const description = element('dd');
        const link = element('a', '', path.split('/').at(-1));
        link.href = path; link.target = '_blank'; link.rel = 'noopener';
        description.append(link);
        row.append(element('dt', '', label), description);
        dl.append(row);
      }
      function selectedIds() { return data.prototypes.filter(item => selected.has(item.id)).map(item => item.id); }
      function promptText() {
        const ids = selectedIds();
        if (!ids.length) return '请先勾选一份或多份原型。';
        const locationPath = decodeURIComponent(new URL('.', window.location.href).pathname);
        const count = latest?.ids.length || 6;
        return `使用 $lottery-ticket-design 继续这个原型项目：${locationPath}\n参考编号：${ids.join(', ')}\n请结合我接下来的反馈，在这些方向的基础上再生成 ${count} 份不同的原型，并保留旧批次。`;
      }
      function syncSelection() {
        const ids = selectedIds();
        const count = document.getElementById('selection-count');
        count.textContent = `已选 ${ids.length} 份`;
        if (ids.length) {
          count.href = '#handoff';
          count.title = '查看顶部迭代指令';
          count.setAttribute('aria-label', `已选 ${ids.length} 份，查看顶部继续迭代指令`);
        } else {
          count.removeAttribute('href');
          count.removeAttribute('title');
          count.removeAttribute('aria-label');
        }
        document.getElementById('clear-button').hidden = ids.length === 0;
        document.getElementById('copy-button').disabled = ids.length === 0;
        document.getElementById('handoff').hidden = ids.length === 0;
        output.value = promptText();
        document.querySelectorAll('.card').forEach(card => card.classList.toggle('is-selected', selected.has(card.dataset.id)));
        syncToolbar();
      }
      async function writeClipboard(value) {
        if (navigator.clipboard && window.isSecureContext) {
          try { await navigator.clipboard.writeText(value); return true; } catch (_) { /* fall through */ }
        }
        const helper = document.createElement('textarea');
        helper.value = value;
        helper.setAttribute('readonly', '');
        helper.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0';
        document.body.append(helper);
        helper.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
        helper.remove();
        return ok;
      }
      function queueCopy(value, message) {
        copyQueue = copyQueue.catch(() => {}).then(async () => {
          const ok = await writeClipboard(value);
          document.getElementById('select-text-button').hidden = ok;
          feedback.classList.toggle('is-success', ok);
          feedback.textContent = ok ? message : '复制受限。请选中文字后手动复制。';
        });
      }
      function renderCard(item) {
        const card = element('article', 'card');
        card.dataset.id = item.id;
        const visual = element('div', `card-preview${skeletonDemo ? ' skeleton-preview' : ''}`);
        const firstScreen = item.screens?.[0];
        const preview = item.preview || firstScreen?.preview;
        if (skeletonDemo) {
          visual.append(skeletonScreen());
        } else if (preview) {
          const img = element('img'); img.src = preview; img.alt = `${item.title} 设计预览`; img.loading = 'lazy'; visual.append(img);
        } else {
          const frame = element('iframe'); frame.src = firstScreen?.file || item.file; frame.title = `${item.title} 缩略预览`; frame.loading = 'lazy'; frame.tabIndex = -1; visual.append(frame);
        }
        const link = element('a', 'card-open', skeletonDemo ? `打开 ${item.id} 设计画板` : `打开 ${item.id} ${item.title} 设计画板`);
        link.href = item.file;
        const pick = element('label', 'pick');
        const checkbox = element('input'); checkbox.type = 'checkbox'; checkbox.value = item.id; checkbox.checked = selected.has(item.id); checkbox.setAttribute('aria-label', skeletonDemo ? `选择 ${item.id}` : `选择 ${item.id} ${item.title}`);
        checkbox.addEventListener('change', () => {
          checkbox.checked ? selected.add(item.id) : selected.delete(item.id);
          syncSelection();
          const ids = selectedIds();
          if (ids.length) queueCopy(ids.join(', '), `已自动复制 ${ids.length} 个编号：${ids.join(', ')}`);
          else feedback.textContent = '选择已清空。';
        });
        pick.append(checkbox, element('span', '', '选择'));
        visual.append(pick, element('span', 'number', item.id));
        const body = element('div', 'card-body');
        if (skeletonDemo) {
          body.append(element('h3', 'sr-only', `原型 ${item.id}`), element('span', 'sr-only', '设计内容待生成'));
          const lines = element('div', 'skeleton-body');
          lines.append(skeletonLine('is-label'), skeletonLine('is-title'), skeletonLine('is-long'), skeletonLine('is-medium'));
          body.append(lines);
          const meta = element('dl', 'meta');
          skeletonMetaRow(meta, '布局', 'is-long'); skeletonMetaRow(meta, '交互', 'is-medium');
          body.append(meta);
          const details = element('details');
          details.append(element('summary', '', '完整元数据'));
          const more = element('dl', 'more');
          for (const label of ['风格', '色彩搭配', '元素', '动效', '字体', '响应式', '设计理由', '参考']) skeletonMetaRow(more, label, 'is-long');
          details.append(more); body.append(details);
        } else {
          const kicker = element('div', 'card-kicker');
          kicker.append(element('span', '', item.direction));
          if (firstScreen) kicker.append(element('span', '', `${item.screens.length} 个界面`));
          body.append(kicker, element('h3', '', item.title), element('p', 'summary', item.summary));
          const meta = element('dl', 'meta');
          metaRow(meta, '布局', item.layout); metaRow(meta, '交互', item.interaction);
          body.append(meta);
          const details = element('details');
          details.append(element('summary', '', '完整元数据'));
          const more = element('dl', 'more');
          metaRow(more, '批次', `第 ${item.batch} 轮`);
          if (item.style) metaRow(more, '风格', item.style);
          metaRow(more, '色彩搭配', item.palette);
          if (item.elements) metaRow(more, '元素', item.elements);
          if (item.motion) metaRow(more, '动效', item.motion);
          if (item.typography) metaRow(more, '字体', item.typography);
          metaRow(more, '响应式', item.responsive);
          metaRow(more, '设计理由', item.rationale);
          inspirationRows(more, item.inspirations);
          if (item.tokens) fileRow(more, '令牌', item.tokens);
          metaRow(more, '标签', (item.tags || []).join('、'));
          metaRow(more, '参考编号', item.parentIds?.join(', ') || '首轮探索');
          details.append(more); body.append(details);
        }
        card.append(visual, body, link);
        return card;
      }
      function renderTimeline() {
        const entries = data.batches.slice().reverse().map(batch => {
          const items = data.prototypes.filter(item => item.batch === batch.number);
          const section = element('section', `timeline-entry${batch === latest ? ' is-latest' : ''}`);
          section.id = `round-${batch.number}`;
          const headingId = `round-heading-${batch.number}`;
          section.setAttribute('aria-labelledby', headingId);
          const marker = element('span', 'timeline-marker');
          marker.setAttribute('aria-hidden', 'true');
          const head = element('header', 'round-meta');
          const heading = element('h2', '', `第 ${batch.number} 轮 · ${batch.title}`); heading.id = headingId;
          head.append(heading, element('span', '', `${items.length} 份`));
          if (batch === latest) head.append(element('span', 'round-latest', '最新'));
          head.append(element('p', '', batch.brief));
          const cards = element('div', 'grid');
          cards.append(...items.map(renderCard));
          section.append(marker, head, cards);
          return section;
        });
        timeline.replaceChildren(...entries);
        document.getElementById('empty').hidden = entries.length !== 0;
        syncSelection();
      }
      document.getElementById('clear-button').addEventListener('click', () => {
        selected.clear();
        document.querySelectorAll('.pick input').forEach(input => { input.checked = false; });
        syncSelection();
        feedback.textContent = '选择已清空。';
      });
      document.getElementById('copy-button').addEventListener('click', () => {
        const ids = selectedIds();
        if (!ids.length) { feedback.textContent = '请先勾选原型。'; return; }
        queueCopy(ids.join(', '), `已复制编号：${ids.join(', ')}`);
      });
      document.getElementById('copy-prompt-button').addEventListener('click', () => {
        if (!selected.size) { feedback.textContent = '请先勾选原型。'; return; }
        queueCopy(promptText(), '已复制迭代指令。');
      });
      document.getElementById('select-text-button').addEventListener('click', () => { output.focus(); output.select(); feedback.textContent = '文字已选中，可以手动复制。'; });
      renderTimeline();
    })();
  </script>
</body>
