<!doctype html>
<html lang="zh-CN" data-ltd-shell="web-viewer" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web 预览 · Lottery Ticket Design</title>
  <!-- __DESIGN_SYSTEM_HEAD__ -->
</head>
<body>
  <header class="toolbar">
    <a class="back" href="../index.html">← 设计画板</a>
    <div class="title"><strong id="screen-title"></strong> <span id="design-id"></span></div>
    <div class="controls">
      <label for="viewport" style="font-size:12px;color:var(--fg-2)">视口</label>
      <select id="viewport" aria-label="桌面视口">
        <option value="1440x900">1440 × 900</option>
        <option value="1920x1080">1920 × 1080</option>
        <option value="1366x768">1366 × 768</option>
        <option value="1280x800">1280 × 800</option>
      </select>
      <button id="fit" type="button" aria-pressed="true">适应窗口</button>
    </div>
    <a class="raw" id="raw" href="#">原始 HTML ↗</a>
  </header>
  <main class="stage" id="stage" aria-label="桌面网页预览">
    <div class="sizer" id="sizer">
      <div class="browser" id="browser">
        <div class="chrome" aria-hidden="true"><span class="dots"><i></i><i></i><i></i></span><span class="address" id="address"></span></div>
        <iframe id="page" title="可交互网页原型"></iframe>
      </div>
    </div>
  </main>
  <script type="application/json" id="viewer-data">__VIEWER_DATA_JSON__</script>
  <script>
    (() => {
      'use strict';
      const data = JSON.parse(document.getElementById('viewer-data').textContent);
      const stage = document.getElementById('stage');
      const sizer = document.getElementById('sizer');
      const browser = document.getElementById('browser');
      const page = document.getElementById('page');
      const picker = document.getElementById('viewport');
      const fit = document.getElementById('fit');
      let fitWindow = true;
      document.title = `${data.screenTitle} · Web 预览`;
      document.getElementById('screen-title').textContent = data.screenTitle;
      document.getElementById('design-id').textContent = `· ${data.designId}`;
      document.getElementById('address').textContent = `${data.designId} / ${data.screenTitle}`;
      document.getElementById('raw').href = data.screenFile;
      page.src = data.screenFile;
      function layout() {
        const [width, height] = picker.value.split('x').map(Number);
        const outerWidth = width + 2;
        const outerHeight = height + 42;
        const scale = fitWindow ? Math.min(1, (stage.clientWidth - 40) / outerWidth, (stage.clientHeight - 40) / outerHeight) : 1;
        browser.style.width = `${outerWidth}px`;
        browser.style.height = `${outerHeight}px`;
        browser.style.transform = `scale(${Math.max(scale, .05)})`;
        page.style.width = `${width}px`;
        page.style.height = `${height}px`;
        sizer.style.width = `${outerWidth * Math.max(scale, .05)}px`;
        sizer.style.height = `${outerHeight * Math.max(scale, .05)}px`;
        stage.style.alignItems = fitWindow ? 'center' : 'flex-start';
        stage.style.justifyContent = fitWindow ? 'center' : 'flex-start';
      }
      picker.addEventListener('change', layout);
      fit.addEventListener('click', () => { fitWindow = !fitWindow; fit.textContent = fitWindow ? '适应窗口' : '100%'; fit.setAttribute('aria-pressed', String(fitWindow)); layout(); });
      new ResizeObserver(layout).observe(stage);
      layout();
    })();
  </script>
</body>
</html>
