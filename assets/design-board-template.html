<!doctype html>
<html lang="zh-CN" data-ltd-shell="board">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设计画板 · Lottery Ticket Design</title>
  <!-- __DESIGN_SYSTEM_HEAD__ -->
</head>
<body>
  <main class="shell">
    <nav class="topbar" aria-label="画板导航">
      <a class="back" href="../../index.html#prototype-grid"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg>原型总览</a>
      <span class="project-name" id="project-name"></span>
      <a class="export-design stage-action" id="set-stage" href="#" hidden>设为阶段</a>
      <a class="export-design" id="export-design" href="#" download hidden><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/></svg>导出原型</a>
    </nav>
    <div class="surface">
      <header class="hero">
        <div>
          <div class="design-tags"><span class="tag" id="design-id"></span><span class="tag is-neutral" id="design-direction"></span></div>
          <h1 id="design-title"></h1>
          <p class="summary" id="design-summary"></p>
        </div>
        <span class="count"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span id="screen-count"></span></span>
      </header>
      <section class="screens-panel" aria-labelledby="screens-heading">
          <h2 class="section-title" id="screens-heading">设计画板</h2>
          <div class="bento-grid" id="screen-grid"></div>
      </section>
        <aside class="facts-panel" id="facts-panel" aria-labelledby="facts-heading">
          <h2 class="section-title" id="facts-heading">设计元数据</h2>
          <dl class="facts" id="design-facts"></dl>
        </aside>
    </div>
  </main>
  <template id="system-specimen-template">
    <style>
      :host { display: block; min-width: 0; container-type: inline-size; color: var(--ds-ink); font: 400 var(--ds-text-body)/1.6 var(--ds-font-body); }
      .ltd-specimens { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
      .ltd-cell { grid-column: span 3; min-width: 0; padding: 22px; border: 1px solid var(--ds-line); border-radius: var(--ds-radius-card); background: var(--ds-canvas); }
      .ltd-cell h4 { margin: 0 0 20px; color: var(--ds-muted); font: 500 12px/1.5 var(--ds-font-body); }
      .ltd-palette { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 10px; }
      .ltd-swatch { min-width: 0; }
      .ltd-paint { height: 34px; margin-bottom: 6px; border: 1px solid var(--ds-line); border-radius: var(--ds-radius-control); background: var(--paint); }
      .ltd-swatch span { display: block; font-size: 11px; }
      .ltd-swatch small { display: block; color: var(--ds-faint); font: 9px/1.6 var(--ds-font-mono); overflow-wrap: anywhere; }
      .ltd-type { display: grid; align-content: start; gap: 12px; }
      .ltd-type .ds-heading { overflow-wrap: anywhere; }
      .ltd-type .ds-copy { font-size: var(--ds-text-body); }
      .ltd-caption { color: var(--ds-faint); font-size: var(--ds-text-caption); }
      .ltd-shapes { display: flex; align-items: end; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
      .ltd-shape { width: 44px; height: 44px; border: 1px solid var(--ds-line); background: var(--ds-surface); box-shadow: var(--ds-shadow-small); }
      .ltd-controls { grid-column: span 6; }
      .ltd-controls .ds-card { display: grid; gap: 18px; }
      .ltd-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
      .ltd-field { display: grid; gap: 7px; font-size: 12px; }
      .ltd-choice { display: inline-flex; align-items: center; gap: 7px; color: var(--ds-muted); font-size: 12px; }
      .ltd-choice .ds-checkbox { margin: 0; }
      .ltd-option-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; }
      .ltd-state { min-height: 25px; }
      @container (max-width: 1000px) { .ltd-cell { grid-column: span 6; } .ltd-controls { grid-column: 1 / -1; } .ltd-palette { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
      @container (max-width: 560px) { .ltd-cell { grid-column: 1 / -1; padding: 18px; } }
    </style>
    <div class="ltd-specimens">
      <section class="ltd-cell" aria-labelledby="palette-title">
        <h4 id="palette-title">色彩</h4>
        <div class="ltd-palette">
          <div class="ltd-swatch" data-swatch><div class="ltd-paint" style="--paint: var(--ds-canvas)"></div><span>背景</span><small></small></div>
          <div class="ltd-swatch" data-swatch><div class="ltd-paint" style="--paint: var(--ds-surface)"></div><span>面板</span><small></small></div>
          <div class="ltd-swatch" data-swatch><div class="ltd-paint" style="--paint: var(--ds-ink)"></div><span>文字</span><small></small></div>
          <div class="ltd-swatch" data-swatch><div class="ltd-paint" style="--paint: var(--ds-accent)"></div><span>强调</span><small></small></div>
          <div class="ltd-swatch" data-swatch><div class="ltd-paint" style="--paint: var(--ds-success)"></div><span>成功</span><small></small></div>
          <div class="ltd-swatch" data-swatch><div class="ltd-paint" style="--paint: var(--ds-label)"></div><span>分类</span><small></small></div>
        </div>
      </section>
      <section class="ltd-cell" aria-labelledby="type-title">
        <h4 id="type-title">字体与形状</h4>
        <div class="ltd-type"><div class="ds-heading">Aa 文</div><p class="ds-copy">正文与界面文字</p><span class="ltd-caption">辅助信息与说明</span></div>
        <div class="ltd-shapes" aria-label="控件、卡片与面板圆角"><span class="ltd-shape" style="border-radius: var(--ds-radius-control)"></span><span class="ltd-shape" style="border-radius: var(--ds-radius-card)"></span><span class="ltd-shape" style="border-radius: var(--ds-radius-surface)"></span></div>
      </section>
      <section class="ltd-cell ltd-controls" aria-labelledby="controls-title">
        <h4 id="controls-title">组件与状态</h4>
        <div class="ds-card">
          <div class="ltd-row"><button class="ds-button" data-variant="primary" type="button">主要按钮</button><button class="ds-button" type="button">次要按钮</button><button class="ds-button" type="button" disabled>禁用</button></div>
          <label class="ltd-field">文本输入<input class="ds-input" placeholder="输入内容"></label>
          <div class="ltd-option-row"><label class="ltd-choice"><input class="ds-checkbox" type="checkbox" checked>选项</label><span class="ltd-choice">开关<button class="ds-switch" role="switch" aria-checked="true" aria-label="组件开关" type="button"></button></span></div>
          <div class="ds-tabs" role="tablist" aria-label="组件状态"><button role="tab" id="state-default" aria-controls="state-default-panel" aria-selected="true" type="button">默认</button><button role="tab" id="state-feedback" aria-controls="state-feedback-panel" aria-selected="false" tabindex="-1" type="button">状态反馈</button></div>
          <div class="ltd-state" id="state-default-panel" role="tabpanel" aria-labelledby="state-default"><span class="ds-badge">分类标签</span></div>
          <div class="ltd-row ltd-state" id="state-feedback-panel" role="tabpanel" aria-labelledby="state-feedback" hidden><span class="ds-badge" data-tone="success">成功</span><span class="ds-badge" data-tone="warning">注意</span><span class="ds-badge" data-tone="danger">错误</span></div>
        </div>
      </section>
    </div>
  </template>
  <script type="application/json" id="design-data">__DESIGN_DATA_JSON__</script>
  <script>
    (() => {
      'use strict';
      const data = JSON.parse(document.getElementById('design-data').textContent);
      const design = data.design;
      const stageAction = document.getElementById('set-stage');
      if (design.stageAction) { stageAction.href = design.stageAction; stageAction.hidden = false; }
      const exportLink = document.getElementById('export-design');
      if (design.exportFile) { exportLink.hidden = false; exportLink.href = design.exportFile; exportLink.download = `${design.id}.zip`; }
      const skeletonDemo = data.skeletonDemo === true;
      function element(tag, className = '') {
        const node = document.createElement(tag); node.className = className; return node;
      }
      function skeletonLine(variant = '') {
        const line = element('span', `skeleton-line${variant ? ` ${variant}` : ''}`);
        line.setAttribute('aria-hidden', 'true'); return line;
      }
      function skeletonPreview(mobile) {
        const shell = element('div', mobile ? 'skeleton-mobile' : 'skeleton-app');
        shell.setAttribute('aria-hidden', 'true');
        let main = shell;
        if (!mobile) {
          const rail = element('div', 'skeleton-app-rail');
          rail.append(skeletonLine('is-medium'), skeletonLine('is-long'), skeletonLine(), skeletonLine('is-medium'));
          main = element('div', 'skeleton-app-main'); shell.append(rail, main);
        }
        const tiles = element('div', 'skeleton-tiles');
        tiles.append(element('div', 'skeleton-block'), element('div', 'skeleton-block'));
        main.append(skeletonLine('is-medium'), skeletonLine('is-long'), element('div', 'skeleton-block'), tiles, skeletonLine(), skeletonLine('is-medium'));
        return shell;
      }
      function openLabel(text) {
        const label = element('span', 'open-label'); label.textContent = text;
        const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        for (const [key, value] of Object.entries({ class: 'icon', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': '1.8', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' })) arrow.setAttribute(key, value);
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path'); path.setAttribute('d', 'M7 17 17 7M7 7h10v10');
        arrow.append(path); label.append(arrow); return label;
      }
      function fitPreview(content, frame, width, height) {
        const resize = () => {
          const scale = Math.min(content.clientWidth / width, content.clientHeight / height);
          frame.style.transform = `scale(${scale})`;
          frame.style.left = `${(content.clientWidth - width * scale) / 2}px`;
          frame.style.top = `${(content.clientHeight - height * scale) / 2}px`;
        };
        new ResizeObserver(resize).observe(content);
      }
      function systemPanel() {
        const panel = element('section', 'system-panel'); panel.setAttribute('aria-labelledby', 'system-heading');
        const header = element('div', 'system-panel-header');
        const title = element('h3'); title.id = 'system-heading'; title.textContent = '设计系统';
        const actions = element('div', 'system-panel-actions');
        const theme = element('button', 'system-theme'); theme.type = 'button'; theme.textContent = '深色预览'; theme.setAttribute('aria-pressed', 'false');
        const link = element('a', 'system-full-link'); link.href = design.systemFile; link.append(openLabel('完整规范'));
        actions.append(theme, link); header.append(title, actions);
        const host = element('div', 'system-specimens'); host.dataset.theme = 'light';
        const root = host.attachShadow({ mode: 'open' });
        const source = element('style');
        // Keep the design's native components and tokens inside the showcase.
        source.textContent = design.systemCss.replace(/:root((?:\.[\w-]+|\[[^\]]+\])*)/g, (_, condition) => condition ? `:host(${condition})` : ':host');
        root.append(source, document.getElementById('system-specimen-template').content.cloneNode(true));
        function refreshSwatches() {
          root.querySelectorAll('[data-swatch]').forEach(swatch => {
            const value = getComputedStyle(swatch.querySelector('.ltd-paint')).backgroundColor;
            swatch.title = value;
            const rgb = value.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/);
            swatch.querySelector('small').textContent = rgb ? '#' + rgb.slice(1).map(channel => Number(channel).toString(16).padStart(2, '0')).join('') : value;
          });
        }
        theme.addEventListener('click', () => {
          const dark = host.dataset.theme !== 'dark'; host.dataset.theme = dark ? 'dark' : 'light';
          theme.setAttribute('aria-pressed', String(dark)); theme.textContent = dark ? '浅色预览' : '深色预览'; refreshSwatches();
        });
        root.querySelector('[role="switch"]').addEventListener('click', event => {
          event.currentTarget.setAttribute('aria-checked', String(event.currentTarget.getAttribute('aria-checked') !== 'true'));
        });
        const tabs = [...root.querySelectorAll('[role="tab"]')];
        function selectTab(tab) {
          tabs.forEach(node => {
            const selected = node === tab; node.setAttribute('aria-selected', String(selected)); node.tabIndex = selected ? 0 : -1;
            root.getElementById(node.getAttribute('aria-controls')).hidden = !selected;
          });
        }
        tabs.forEach((tab, index) => {
          tab.addEventListener('click', () => selectTab(tab));
          tab.addEventListener('keydown', event => {
            let next;
            if (event.key === 'ArrowRight') next = tabs[(index + 1) % tabs.length];
            if (event.key === 'ArrowLeft') next = tabs[(index + tabs.length - 1) % tabs.length];
            if (event.key === 'Home') next = tabs[0]; if (event.key === 'End') next = tabs.at(-1);
            if (next) { event.preventDefault(); selectTab(next); next.focus(); }
          });
        });
        panel.append(header, host);
        requestAnimationFrame(refreshSwatches);
        return panel;
      }
      document.title = skeletonDemo ? `${design.id} · 设计画板 · Lottery Ticket Design` : `${design.id} ${design.title} · Lottery Ticket Design`;
      document.getElementById('design-id').textContent = design.id;
      const projectName = document.getElementById('project-name');
      const direction = document.getElementById('design-direction');
      const designTitle = document.getElementById('design-title');
      const designSummary = document.getElementById('design-summary');
      const screenCount = document.getElementById('screen-count');
      if (skeletonDemo) {
        projectName.append(skeletonLine('is-project')); projectName.setAttribute('aria-label', '项目名称待生成');
        direction.append(skeletonLine('is-label')); direction.setAttribute('aria-label', '设计方向待生成');
        designTitle.append(skeletonLine('is-title')); designTitle.setAttribute('aria-label', '设计名称待生成');
        designSummary.classList.add('skeleton-copy');
        designSummary.append(skeletonLine('is-long'), skeletonLine('is-medium')); designSummary.setAttribute('aria-label', '设计说明待生成');
        screenCount.append(skeletonLine('is-count')); screenCount.setAttribute('aria-label', `${design.screens.length} 个界面`);
      } else {
        projectName.textContent = data.projectTitle;
        direction.textContent = design.direction;
        designTitle.textContent = design.title;
        designSummary.textContent = design.summary;
        screenCount.textContent = `${design.screens.length} 个界面`;
      }
      const facts = document.getElementById('design-facts');
      for (const [key, label] of [
        ['layout', '布局'], ['style', '风格'], ['palette', '色彩搭配'],
        ['elements', '元素'], ['motion', '动效'], ['typography', '字体'], ['interaction', '交互']
      ]) {
        if (!skeletonDemo && !design[key]) continue;
        const row = document.createElement('div');
        const term = document.createElement('dt'); term.textContent = label;
        const value = document.createElement('dd');
        if (skeletonDemo) {
          value.className = 'skeleton-copy'; value.append(skeletonLine('is-long'), skeletonLine('is-medium')); value.setAttribute('aria-label', '内容待生成');
        } else value.textContent = design[key];
        row.append(term, value); facts.append(row);
      }
      const grid = document.getElementById('screen-grid');
      const hasSystem = Boolean(design.systemFile && design.systemCss);
      const additionalScreens = design.screens.length - 1;
      const secondaryCards = [];
      const factsPanel = document.getElementById('facts-panel');
      if (hasSystem) grid.append(systemPanel());
      design.screens.forEach((screen, index) => {
        const card = document.createElement('article'); card.className = 'screen';
        if (index === 0) card.classList.add('is-featured');
        else {
          secondaryCards.push(card);
          if (additionalScreens % 3 === 1 && index === design.screens.length - 1) card.classList.add('is-full');
          if (additionalScreens % 3 === 2 && index === design.screens.length - 2) card.classList.add('is-wide');
        }
        const mobile = screen.viewer === 'iphone-18-pro';
        const preview = document.createElement('div'); preview.className = `preview ${mobile ? 'preview-mobile' : 'preview-web'}`;
        let content = preview;
        if (mobile) {
          const phone = document.createElement('div'); phone.className = 'mini-phone';
          content = document.createElement('div'); content.className = 'mini-screen';
          phone.append(content); preview.append(phone);
        } else {
          const chrome = document.createElement('div'); chrome.className = 'mini-chrome'; chrome.setAttribute('aria-hidden', 'true');
          for (let dot = 0; dot < 3; dot++) chrome.append(document.createElement('i'));
          preview.append(chrome);
          content = document.createElement('div'); content.className = 'web-canvas'; preview.append(content);
        }
        if (skeletonDemo) {
          content.append(skeletonPreview(mobile));
        } else if (screen.preview) {
          const img = document.createElement('img'); img.src = screen.preview; img.alt = `${screen.title} 界面预览`; img.loading = 'lazy'; content.append(img);
        } else {
          const frame = document.createElement('iframe'); frame.src = screen.file; frame.title = `${screen.title} 缩略预览`; frame.loading = 'lazy'; frame.tabIndex = -1; content.append(frame);
          if (!mobile) {
            fitPreview(content, frame, 1440, 900);
          }
        }
        const body = document.createElement('div'); body.className = 'screen-body';
        const copy = document.createElement('div');
        const number = document.createElement('div'); number.className = 'screen-id'; number.textContent = skeletonDemo ? String(index + 1).padStart(2, '0') : `${String(index + 1).padStart(2, '0')} / ${screen.id}`;
        const title = document.createElement('h3');
        if (skeletonDemo) {
          copy.className = 'skeleton-screen-copy';
          title.append(skeletonLine('is-screen-title')); title.setAttribute('aria-label', `界面 ${index + 1}`);
        } else title.textContent = screen.title;
        copy.append(number, title);
        if (skeletonDemo) {
          const summary = element('p', 'screen-summary skeleton-copy'); summary.append(skeletonLine('is-long'), skeletonLine('is-medium')); summary.setAttribute('aria-label', '界面说明待生成'); copy.append(summary);
        } else if (screen.summary) { const summary = document.createElement('p'); summary.className = 'screen-summary'; summary.textContent = screen.summary; copy.append(summary); }
        body.append(copy, openLabel(mobile ? 'iPhone 18 Pro' : 'Web'));
        const link = document.createElement('a'); link.className = 'screen-link'; link.href = screen.viewerFile || screen.file; link.textContent = skeletonDemo ? `预览界面 ${index + 1}` : `体验 ${screen.title}`;
        card.append(preview, body, link); grid.append(card);
        if (index === 0) grid.append(factsPanel);
      });
      if (secondaryCards.length % 2 === 1) secondaryCards.at(-1).classList.add('is-tablet-wide');
    })();
  </script>
</body>
</html>
