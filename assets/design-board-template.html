<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设计画板 · Lottery Ticket Design</title>
  <style>
    :root {
      --bg: #101112; --surface: #151719; --fg: #f4f1e9; --fg-2: #cbc7bd;
      --muted: #918e87; --border: #2d3034; --accent: #a88aff;
      --font-display: Georgia, "Songti SC", "Noto Serif CJK SC", serif;
      --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-mono: "SF Mono", ui-monospace, Menlo, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { color-scheme: dark; }
    body { margin: 0; min-width: 320px; min-height: 100vh; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .shell { width: min(100%, 1520px); margin: 0 auto; padding: 36px clamp(18px, 4vw, 64px) 90px; }
    .back { display: inline-flex; align-items: center; gap: 8px; color: var(--fg-2); font-size: 12px; text-decoration: none; }
    .back:hover { color: var(--fg); }
    .hero { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin: 38px 0 26px; padding-bottom: 27px; border-bottom: 1px solid var(--border); }
    .eyebrow { color: var(--accent); font: 11px/1.4 var(--font-mono); letter-spacing: .12em; }
    h1 { margin: 10px 0 0; font: 500 clamp(34px, 4vw, 54px)/1.12 var(--font-display); letter-spacing: -.035em; }
    .summary { max-width: 680px; margin: 12px 0 0; color: var(--fg-2); font-size: 13px; }
    .count { flex: none; color: var(--muted); font: 12px/1.5 var(--font-mono); }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
    .screen { position: relative; min-width: 0; overflow: hidden; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); transition: border-color .18s ease, transform .18s ease; }
    .screen:hover { border-color: var(--muted); transform: translateY(-2px); }
    .preview { height: clamp(260px, 32vw, 490px); overflow: hidden; border-bottom: 1px solid var(--border); background: #1b1d20; }
    .preview img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
    .preview iframe { width: 100%; height: 100%; border: 0; background: white; pointer-events: none; }
    .screen-body { display: flex; justify-content: space-between; align-items: start; gap: 18px; padding: 16px 19px 18px; }
    .screen-id { color: var(--accent); font: 11px/1.4 var(--font-mono); }
    h2 { margin: 5px 0 0; font: 500 22px/1.25 var(--font-display); }
    .screen-summary { margin: 6px 0 0; color: var(--fg-2); font-size: 12px; }
    .open-label { flex: none; padding-top: 5px; color: var(--muted); font-size: 12px; }
    .screen-link { position: absolute; inset: 0; font-size: 0; }
    .screen-link:focus-visible { outline-offset: -5px; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } .hero { margin-top: 28px; } .preview { height: 360px; } }
    @media (max-width: 520px) { .shell { padding-top: 24px; } .hero { display: block; } .count { display: block; margin-top: 14px; } .preview { height: 260px; } }
    @media (prefers-reduced-motion: reduce) { .screen { transition: none; } }
  </style>
</head>
<body>
  <main class="shell">
    <a class="back" href="../../index.html">← 返回原型总览</a>
    <header class="hero">
      <div>
        <div class="eyebrow" id="eyebrow"></div>
        <h1 id="design-title"></h1>
        <p class="summary" id="design-summary"></p>
      </div>
      <span class="count" id="screen-count"></span>
    </header>
    <div class="grid" id="screen-grid" aria-label="设计界面"></div>
  </main>
  <script type="application/json" id="design-data">__DESIGN_DATA_JSON__</script>
  <script>
    (() => {
      'use strict';
      const data = JSON.parse(document.getElementById('design-data').textContent);
      const design = data.design;
      document.title = `${design.id} ${design.title} · Lottery Ticket Design`;
      document.getElementById('eyebrow').textContent = `${design.id} / ${design.direction}`;
      document.getElementById('design-title').textContent = design.title;
      document.getElementById('design-summary').textContent = design.summary;
      document.getElementById('screen-count').textContent = `${design.screens.length} 个界面`;
      const grid = document.getElementById('screen-grid');
      design.screens.forEach((screen, index) => {
        const card = document.createElement('article'); card.className = 'screen';
        const preview = document.createElement('div'); preview.className = 'preview';
        if (screen.preview) {
          const img = document.createElement('img'); img.src = screen.preview; img.alt = `${screen.title} 界面预览`; img.loading = 'lazy'; preview.append(img);
        } else {
          const frame = document.createElement('iframe'); frame.src = screen.file; frame.title = `${screen.title} 缩略预览`; frame.loading = 'lazy'; frame.tabIndex = -1; preview.append(frame);
        }
        const body = document.createElement('div'); body.className = 'screen-body';
        const copy = document.createElement('div');
        const number = document.createElement('div'); number.className = 'screen-id'; number.textContent = `${String(index + 1).padStart(2, '0')} / ${screen.id}`;
        const title = document.createElement('h2'); title.textContent = screen.title;
        copy.append(number, title);
        if (screen.summary) { const summary = document.createElement('p'); summary.className = 'screen-summary'; summary.textContent = screen.summary; copy.append(summary); }
        const openLabel = document.createElement('span'); openLabel.className = 'open-label'; openLabel.textContent = '查看界面 ↗';
        body.append(copy, openLabel);
        const link = document.createElement('a'); link.className = 'screen-link'; link.href = screen.file; link.textContent = `打开 ${screen.title} HTML`;
        card.append(preview, body, link); grid.append(card);
      });
    })();
  </script>
</body>
</html>
