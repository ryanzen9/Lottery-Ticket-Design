<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设计画板 · Lottery Ticket Design</title>
  <style>
    :root {
      --bg: #f0f2ef; --surface: #ffffff; --surface-warm: #f4f6f3; --surface-raised: #fafbf9;
      --fg: #292f2b; --fg-2: #606b64; --muted: #69746c;
      --border: #e0e6df; --border-soft: #edf0eb; --accent: #4c6355;
      --label-bg: #edf3f7; --label-fg: #526b7c; --label-border: #dde7ed;
      --skeleton: #e6ebe5;
      --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { color-scheme: light; }
    body { margin: 0; min-width: 320px; min-height: 100vh; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .shell { width: min(100%, 1580px); margin: 0 auto; padding: 22px clamp(14px, 2.5vw, 40px) 40px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 16px; }
    .back { display: inline-flex; min-height: 38px; align-items: center; gap: 8px; padding: 0 12px; border-radius: 12px; color: var(--fg-2); font-size: 12px; font-weight: 500; text-decoration: none; transition: background-color .18s ease; }
    .back:hover { background: #e6ece5; color: var(--fg); }
    .icon { flex: none; width: 18px; height: 18px; }
    .project-name { overflow: hidden; max-width: 55%; color: var(--fg-2); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .surface { min-height: calc(100vh - 116px); padding: clamp(24px, 3vw, 44px); border: 1px solid var(--border); border-radius: 32px; background: var(--surface); box-shadow: 0 20px 60px #293b2e0d, 0 3px 12px #293b2e05; }
    .hero { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin-bottom: 32px; }
    .hero > div { min-width: 0; flex: 1; }
    .design-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag { padding: 4px 9px; border: 1px solid var(--label-border); border-radius: 9px; background: var(--label-bg); color: var(--label-fg); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .tag.is-neutral { border-color: var(--border-soft); background: var(--surface-warm); color: var(--fg-2); }
    h1 { margin: 14px 0 0; font: 700 clamp(26px, 3vw, 38px)/1.2 var(--font-body); letter-spacing: -.035em; }
    .summary { max-width: 720px; margin: 12px 0 0; color: var(--fg-2); font-size: 14px; line-height: 1.7; }
    .count { display: inline-flex; flex: none; align-items: center; gap: 7px; padding: 8px 11px; border: 1px solid var(--border-soft); border-radius: 12px; background: var(--surface-warm); color: var(--fg-2); font-size: 12px; }
    .count .icon { width: 16px; height: 16px; }
    .board-layout { display: grid; grid-template-columns: minmax(0, 1fr) 264px; align-items: start; gap: 28px; }
    .screens-panel { min-width: 0; }
    .section-title { margin: 0 0 16px; font: 600 14px/1.5 var(--font-body); }
    .facts-panel { position: sticky; top: 24px; padding: 20px; border: 1px solid var(--border-soft); border-radius: 22px; background: var(--surface-raised); }
    .facts { display: grid; gap: 20px; margin: 0; }
    .facts div { min-width: 0; }
    .facts dt { color: var(--muted); font-size: 11px; }
    .facts dd { margin: 5px 0 0; color: var(--fg-2); font-size: 12px; line-height: 1.65; overflow-wrap: anywhere; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; gap: 20px; }
    .screen { position: relative; min-width: 0; overflow: hidden; border: 1px solid var(--border); border-radius: 22px; background: var(--surface); box-shadow: 0 2px 8px #293b2e04; transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease; }
    .screen:only-child { grid-column: 1 / -1; }
    .screen:hover { border-color: #c4d0c5; box-shadow: 0 8px 22px #293b2e0b; transform: translateY(-2px); }
    .preview { height: clamp(260px, 25vw, 370px); overflow: hidden; border-bottom: 1px solid var(--border-soft); background: var(--surface-warm); }
    .screen:only-child .preview { height: clamp(300px, 38vw, 520px); }
    .preview img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
    .preview iframe { width: 100%; height: 100%; border: 0; background: white; pointer-events: none; }
    .preview-web { display: flex; flex-direction: column; }
    .preview-web .mini-chrome { flex: none; height: 29px; display: flex; align-items: center; gap: 5px; padding: 0 12px; border-bottom: 1px solid var(--border-soft); background: #f6f8f5; }
    .preview-web .mini-chrome i { width: 5px; height: 5px; border-radius: 50%; background: #c1cbc0; }
    .web-canvas { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #fff; }
    .preview-web .web-canvas iframe { position: absolute; top: 0; left: 0; width: 1440px; height: 900px; transform-origin: top left; }
    .preview-web img { flex: 1; min-height: 0; }
    .preview-mobile { display: grid; place-items: center; min-height: 320px; }
    .mini-phone { position: relative; width: 138px; height: 286px; padding: 6px; border: 1px solid #85898c; border-radius: 29px; background: #101113; box-shadow: 0 12px 25px #293b2e1a; }
    .mini-screen { width: 124px; height: 272px; overflow: hidden; border-radius: 23px; background: #fff; }
    .mini-screen iframe { width: 402px; height: 874px; transform: scale(.30846); transform-origin: top left; }
    .mini-screen img { width: 100%; height: 100%; object-fit: cover; }
    .mini-phone::after { content: ''; position: absolute; top: 10px; left: 50%; width: 42px; height: 12px; border-radius: 9px; background: #08090a; transform: translateX(-50%); pointer-events: none; }
    .screen-body { display: flex; justify-content: space-between; align-items: start; gap: 14px; padding: 18px 20px 20px; }
    .screen-body > div { min-width: 0; }
    .screen-id { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .screen h3 { margin: 6px 0 0; font: 650 18px/1.4 var(--font-body); letter-spacing: -.02em; }
    .screen-summary { margin: 7px 0 0; color: var(--fg-2); font-size: 12px; line-height: 1.65; }
    .open-label { display: inline-flex; flex: none; align-items: center; gap: 5px; padding: 4px 7px; border: 1px solid var(--label-border); border-radius: 9px; background: var(--label-bg); color: var(--label-fg); font-size: 10px; }
    .open-label .icon { width: 13px; height: 13px; }
    .screen-link { position: absolute; inset: 0; font-size: 0; }
    .screen-link:focus-visible { outline-offset: -5px; }
    .skeleton-line { display: block; width: 100%; height: 10px; border-radius: 6px; background: var(--skeleton); }
    .skeleton-line.is-short { width: 44%; }
    .skeleton-line.is-medium { width: 68%; }
    .skeleton-line.is-long { width: 88%; }
    .skeleton-line.is-project { width: 96px; }
    .skeleton-line.is-label { width: 62px; }
    .skeleton-line.is-count { width: 44px; }
    .skeleton-line.is-title { width: 280px; max-width: 100%; height: clamp(30px, 3vw, 40px); border-radius: 10px; }
    .skeleton-line.is-screen-title { width: 128px; max-width: 100%; height: 20px; border-radius: 7px; }
    .skeleton-copy { display: grid; gap: 10px; }
    .tag .skeleton-line { margin: 3px 0; }
    .facts dd.skeleton-copy { gap: 7px; padding-top: 3px; }
    .screen-body > .skeleton-screen-copy { flex: 1; }
    .skeleton-app { display: grid; grid-template-columns: 22% minmax(0, 1fr); width: 100%; height: 100%; background: #fcfdfb; }
    .skeleton-app-rail { display: grid; align-content: start; gap: 16px; padding: 24px 12px; border-right: 1px solid var(--border-soft); }
    .skeleton-app-main { display: grid; min-width: 0; align-content: start; gap: 16px; padding: 24px; }
    .skeleton-app-main > .skeleton-line:first-child { height: 16px; border-radius: 7px; }
    .skeleton-block { height: 76px; border-radius: 14px; background: #edf1eb; }
    .skeleton-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .skeleton-tiles .skeleton-block { height: 68px; }
    .skeleton-mobile { display: grid; align-content: start; gap: 10px; height: 100%; padding: 32px 12px 16px; background: #fcfdfb; }
    .skeleton-mobile .skeleton-line { height: 5px; border-radius: 3px; }
    .skeleton-mobile > .skeleton-line:first-child { height: 9px; }
    .skeleton-mobile .skeleton-block { height: 62px; border-radius: 9px; }
    .skeleton-mobile .skeleton-tiles { gap: 6px; }
    .skeleton-mobile .skeleton-tiles .skeleton-block { height: 46px; border-radius: 7px; }
    @media (max-width: 1180px) { .board-layout { grid-template-columns: 1fr; } .facts-panel { position: static; } .facts { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; } }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } .surface { padding: 26px; border-radius: 26px; } .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } .preview { height: 360px; } }
    @media (max-width: 520px) { .shell { padding: 14px 12px 24px; } .surface { padding: 22px 18px; border-radius: 24px; } .topbar { gap: 10px; } .back { padding: 0 6px; } .hero { display: block; margin-bottom: 26px; } .count { margin-top: 16px; } .preview, .screen:only-child .preview { height: 280px; } .screen-body { padding: 16px; } .facts { grid-template-columns: 1fr; } .facts-panel { padding: 18px; } }
    @media (prefers-reduced-motion: reduce) { .screen { transition: none; } }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topbar" aria-label="画板导航">
      <a class="back" href="../../index.html#prototype-grid"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg>原型总览</a>
      <span class="project-name" id="project-name"></span>
    </nav>
    <div class="surface">
      <header class="hero">
        <div>
          <div class="design-tags"><span class="tag" id="design-id"></span><span class="tag is-neutral" id="design-direction"></span></div>
          <h1 id="design-title"></h1>
          <p class="summary" id="design-summary"></p>
        </div>
        <span class="count"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span id="screen-count"></span></span>
      </header>
      <div class="board-layout">
        <section class="screens-panel" aria-labelledby="screens-heading">
          <h2 class="section-title" id="screens-heading">界面画板</h2>
          <div class="grid" id="screen-grid"></div>
        </section>
        <aside class="facts-panel" aria-labelledby="facts-heading">
          <h2 class="section-title" id="facts-heading">设计元数据</h2>
          <dl class="facts" id="design-facts"></dl>
        </aside>
      </div>
    </div>
  </main>
  <script type="application/json" id="design-data">__DESIGN_DATA_JSON__</script>
  <script>
    (() => {
      'use strict';
      const data = JSON.parse(document.getElementById('design-data').textContent);
      const design = data.design;
      const skeletonDemo = data.skeletonDemo === true;
      function element(tag, className = '') {
        const node = document.createElement(tag); node.className = className; return node;
      }
      function skeletonLine(variant = '') {
        const line = element('span', `skeleton-line${variant ? ` ${variant}` : ''}`);
        line.setAttribute('aria-hidden', 'true'); return line;
      }
      function skeletonPreview(mobile) {
        const shell = element('div', mobile ? 'skeleton-mobile' : 'skeleton-app');
        shell.setAttribute('aria-hidden', 'true');
        let main = shell;
        if (!mobile) {
          const rail = element('div', 'skeleton-app-rail');
          rail.append(skeletonLine('is-medium'), skeletonLine('is-long'), skeletonLine(), skeletonLine('is-medium'));
          main = element('div', 'skeleton-app-main'); shell.append(rail, main);
        }
        const tiles = element('div', 'skeleton-tiles');
        tiles.append(element('div', 'skeleton-block'), element('div', 'skeleton-block'));
        main.append(skeletonLine('is-medium'), skeletonLine('is-long'), element('div', 'skeleton-block'), tiles, skeletonLine(), skeletonLine('is-medium'));
        return shell;
      }
      document.title = skeletonDemo ? `${design.id} · 设计画板 · Lottery Ticket Design` : `${design.id} ${design.title} · Lottery Ticket Design`;
      document.getElementById('design-id').textContent = design.id;
      const projectName = document.getElementById('project-name');
      const direction = document.getElementById('design-direction');
      const designTitle = document.getElementById('design-title');
      const designSummary = document.getElementById('design-summary');
      const screenCount = document.getElementById('screen-count');
      if (skeletonDemo) {
        projectName.append(skeletonLine('is-project')); projectName.setAttribute('aria-label', '项目名称待生成');
        direction.append(skeletonLine('is-label')); direction.setAttribute('aria-label', '设计方向待生成');
        designTitle.append(skeletonLine('is-title')); designTitle.setAttribute('aria-label', '设计名称待生成');
        designSummary.classList.add('skeleton-copy');
        designSummary.append(skeletonLine('is-long'), skeletonLine('is-medium')); designSummary.setAttribute('aria-label', '设计说明待生成');
        screenCount.append(skeletonLine('is-count')); screenCount.setAttribute('aria-label', `${design.screens.length} 个界面`);
      } else {
        projectName.textContent = data.projectTitle;
        direction.textContent = design.direction;
        designTitle.textContent = design.title;
        designSummary.textContent = design.summary;
        screenCount.textContent = `${design.screens.length} 个界面`;
      }
      const facts = document.getElementById('design-facts');
      for (const [key, label] of [
        ['layout', '布局'], ['style', '风格'], ['palette', '色彩搭配'],
        ['elements', '元素'], ['motion', '动效'], ['typography', '字体'], ['interaction', '交互']
      ]) {
        if (!skeletonDemo && !design[key]) continue;
        const row = document.createElement('div');
        const term = document.createElement('dt'); term.textContent = label;
        const value = document.createElement('dd');
        if (skeletonDemo) {
          value.className = 'skeleton-copy'; value.append(skeletonLine('is-long'), skeletonLine('is-medium')); value.setAttribute('aria-label', '内容待生成');
        } else value.textContent = design[key];
        row.append(term, value); facts.append(row);
      }
      const grid = document.getElementById('screen-grid');
      design.screens.forEach((screen, index) => {
        const card = document.createElement('article'); card.className = 'screen';
        const mobile = screen.viewer === 'iphone-18-pro';
        const preview = document.createElement('div'); preview.className = `preview ${mobile ? 'preview-mobile' : 'preview-web'}`;
        let content = preview;
        if (mobile) {
          const phone = document.createElement('div'); phone.className = 'mini-phone';
          content = document.createElement('div'); content.className = 'mini-screen';
          phone.append(content); preview.append(phone);
        } else {
          const chrome = document.createElement('div'); chrome.className = 'mini-chrome'; chrome.setAttribute('aria-hidden', 'true');
          for (let dot = 0; dot < 3; dot++) chrome.append(document.createElement('i'));
          preview.append(chrome);
          content = document.createElement('div'); content.className = 'web-canvas'; preview.append(content);
        }
        if (skeletonDemo) {
          content.append(skeletonPreview(mobile));
        } else if (screen.preview) {
          const img = document.createElement('img'); img.src = screen.preview; img.alt = `${screen.title} 界面预览`; img.loading = 'lazy'; content.append(img);
        } else {
          const frame = document.createElement('iframe'); frame.src = screen.file; frame.title = `${screen.title} 缩略预览`; frame.loading = 'lazy'; frame.tabIndex = -1; content.append(frame);
          if (!mobile) {
            const sizePreview = () => {
              const scale = Math.min(content.clientWidth / 1440, content.clientHeight / 900);
              frame.style.transform = `scale(${scale})`;
              frame.style.left = `${(content.clientWidth - 1440 * scale) / 2}px`;
            };
            new ResizeObserver(sizePreview).observe(content);
          }
        }
        const body = document.createElement('div'); body.className = 'screen-body';
        const copy = document.createElement('div');
        const number = document.createElement('div'); number.className = 'screen-id'; number.textContent = skeletonDemo ? String(index + 1).padStart(2, '0') : `${String(index + 1).padStart(2, '0')} / ${screen.id}`;
        const title = document.createElement('h3');
        if (skeletonDemo) {
          copy.className = 'skeleton-screen-copy';
          title.append(skeletonLine('is-screen-title')); title.setAttribute('aria-label', `界面 ${index + 1}`);
        } else title.textContent = screen.title;
        copy.append(number, title);
        if (skeletonDemo) {
          const summary = element('p', 'screen-summary skeleton-copy'); summary.append(skeletonLine('is-long'), skeletonLine('is-medium')); summary.setAttribute('aria-label', '界面说明待生成'); copy.append(summary);
        } else if (screen.summary) { const summary = document.createElement('p'); summary.className = 'screen-summary'; summary.textContent = screen.summary; copy.append(summary); }
        const openLabel = document.createElement('span'); openLabel.className = 'open-label'; openLabel.textContent = mobile ? 'iPhone 18 Pro' : 'Web';
        const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        for (const [key, value] of Object.entries({ class: 'icon', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': '1.8', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' })) arrow.setAttribute(key, value);
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path'); path.setAttribute('d', 'M7 17 17 7M7 7h10v10');
        arrow.append(path); openLabel.append(arrow);
        body.append(copy, openLabel);
        const link = document.createElement('a'); link.className = 'screen-link'; link.href = screen.viewerFile || screen.file; link.textContent = skeletonDemo ? `预览界面 ${index + 1}` : `体验 ${screen.title}`;
        card.append(preview, body, link); grid.append(card);
      });
    })();
  </script>
</body>
</html>
