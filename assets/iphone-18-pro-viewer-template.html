<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iPhone 18 Pro 预览 · Lottery Ticket Design</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; height: 100dvh; display: flex; flex-direction: column; background: #101112; color: #f4f1e9; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    :focus-visible { outline: 2px solid #a88aff; outline-offset: 3px; }
    .toolbar { min-height: 64px; padding: 11px clamp(14px, 2.5vw, 32px); display: flex; align-items: center; gap: 18px; border-bottom: 1px solid #303238; }
    .back, .raw { white-space: nowrap; color: #cbc7bd; font-size: 12px; }
    .back:hover, .raw:hover { color: white; }
    .title { min-width: 0; flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .title strong { font-weight: 600; }
    .device-name { white-space: nowrap; color: #cbc7bd; font-size: 12px; }
    .fit { min-height: 34px; padding: 6px 10px; border: 1px solid #3c3f44; border-radius: 6px; background: #1c1e21; color: #f4f1e9; font-size: 12px; cursor: pointer; }
    .stage { flex: 1; min-height: 0; overflow: auto; display: flex; justify-content: center; align-items: center; padding: 20px; background: #191b1e; }
    .sizer { position: relative; flex: none; }
    .device { position: relative; width: 426px; height: 898px; padding: 7px; border: 5px solid #8e949a; border-radius: 61px; background: #101113; box-shadow: 0 0 0 1px #bdc2c6, 0 22px 65px #0009, inset 0 0 0 2px #34383d; transform-origin: top left; }
    .side-button { position: absolute; width: 3px; border-radius: 3px; background: #6d7379; }
    .side-button.left-a { left: -4px; top: 162px; height: 42px; }
    .side-button.left-b { left: -4px; top: 222px; height: 76px; }
    .side-button.right { right: -4px; top: 207px; height: 92px; }
    .screen { position: relative; width: 402px; height: 874px; overflow: hidden; border-radius: 49px; background: #fff; }
    iframe { display: block; width: 402px; height: 874px; border: 0; background: white; }
    .status { position: absolute; z-index: 2; top: 14px; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 30px; color: #111; font-size: 14px; font-weight: 650; line-height: 21px; pointer-events: none; }
    .status-light .status { color: #fff; text-shadow: 0 1px 2px #0009; }
    .status svg { width: 46px; height: 16px; fill: currentColor; }
    .island { position: absolute; z-index: 3; top: 11px; left: 50%; width: 112px; height: 31px; border-radius: 18px; background: #08090a; transform: translateX(-50%); pointer-events: none; }
    .home { position: absolute; z-index: 2; bottom: 9px; left: 50%; width: 138px; height: 5px; border-radius: 5px; background: #111; transform: translateX(-50%); pointer-events: none; }
    .status-light .home { background: #fff; box-shadow: 0 1px 2px #0008; }
    @media (max-width: 700px) { .toolbar { flex-wrap: wrap; gap: 8px 14px; } .title { order: -1; flex-basis: 100%; } .stage { padding: 10px; } }
  </style>
</head>
<body>
  <header class="toolbar">
    <a class="back" href="../index.html">← 设计画板</a>
    <div class="title"><strong id="screen-title"></strong> <span id="design-id"></span></div>
    <span class="device-name">iPhone 18 Pro · 402 × 874</span>
    <button class="fit" id="fit" type="button" aria-pressed="true">适应窗口</button>
    <a class="raw" id="raw" href="#" target="_blank" rel="noopener">原始 HTML ↗</a>
  </header>
  <main class="stage" id="stage" aria-label="iPhone 18 Pro 应用预览">
    <div class="sizer" id="sizer">
      <div class="device" id="device">
        <span class="side-button left-a" aria-hidden="true"></span><span class="side-button left-b" aria-hidden="true"></span><span class="side-button right" aria-hidden="true"></span>
        <div class="screen" id="screen">
          <iframe id="page" title="可交互移动应用原型"></iframe>
          <div class="status" aria-hidden="true"><span>9:41</span><svg viewBox="0 0 46 16" aria-hidden="true"><path d="M1 12h3V9H1zm5 0h3V6H6zm5 0h3V3h-3zm10-1.5a7 7 0 0 1 10 0l-5 4.5zM37 3h6a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm8 3h1v4h-1z"/></svg></div>
          <div class="island" aria-hidden="true"></div>
          <div class="home" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </main>
  <script type="application/json" id="viewer-data">__VIEWER_DATA_JSON__</script>
  <script>
    (() => {
      'use strict';
      const data = JSON.parse(document.getElementById('viewer-data').textContent);
      const stage = document.getElementById('stage');
      const sizer = document.getElementById('sizer');
      const device = document.getElementById('device');
      const fit = document.getElementById('fit');
      let fitWindow = true;
      document.title = `${data.screenTitle} · iPhone 18 Pro 预览`;
      document.getElementById('screen-title').textContent = data.screenTitle;
      document.getElementById('design-id').textContent = `· ${data.designId}`;
      document.getElementById('raw').href = data.screenFile;
      document.getElementById('page').src = data.screenFile;
      if (data.statusBar === 'light') document.getElementById('screen').classList.add('status-light');
      function layout() {
        const scale = fitWindow ? Math.min(1, (stage.clientWidth - 40) / 426, (stage.clientHeight - 40) / 898) : 1;
        const visibleScale = Math.max(scale, .2);
        device.style.transform = `scale(${visibleScale})`;
        sizer.style.width = `${426 * visibleScale}px`;
        sizer.style.height = `${898 * visibleScale}px`;
        stage.style.alignItems = fitWindow ? 'center' : 'flex-start';
        stage.style.justifyContent = fitWindow ? 'center' : 'flex-start';
      }
      fit.addEventListener('click', () => { fitWindow = !fitWindow; fit.textContent = fitWindow ? '适应窗口' : '100%'; fit.setAttribute('aria-pressed', String(fitWindow)); layout(); });
      new ResizeObserver(layout).observe(stage);
      window.addEventListener('resize', layout);
      window.addEventListener('load', layout);
      layout();
    })();
  </script>
</body>
</html>
